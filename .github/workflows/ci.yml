name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Type check
        run: npx tsc --noEmit
      - name: Lint
        run: npx next lint --quiet
      - name: Unit tests
        run: npx jest --ci
      - name: Build
        run: npx next build
        env:
          # Build-time only: a throwaway local database and secret.
          DATABASE_URL: file:./data/ci.db
          AUTH_SECRET: ci-only-not-a-real-secret
